# Releases korn (the background sync CLI) when a tag like korn-v0.1.0 is pushed:
# test → publish korn-sync to npm (npm, pnpm, yarn, bun install it) → write Formula/korn.rb (Homebrew,
# from the npm tarball) and commit it to main.
#
# One-time setup (see docs/daemon.md "Releasing"):
# - this repo is public (brew tap clones it; npm provenance needs it)
# - secret NPM_TOKEN: an npm Granular Access Token that can publish korn-sync
#
# Release: bump daemon/version.ts, commit, then `make korn-tag` prints the tag commands.
name: korn release

on:
  push:
    tags: ['korn-v*']

permissions:
  contents: write # commit Formula/korn.rb to main
  id-token: write # npm provenance

jobs:
  release:
    runs-on: macos-latest # the tests use macOS tools (osacompile)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches daemon/version.ts
        run: |
          VERSION=$(node -p "require('fs').readFileSync('daemon/version.ts','utf8').match(/'(.+)'/)[1]")
          if [ "korn-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match daemon/version.ts ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Test
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          npm test

      - name: Publish korn-sync to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::secret NPM_TOKEN is not set (see docs/daemon.md, Releasing)"
            exit 1
          fi
          make npm-build
          # Publish the exact file we pack: the registry serves these bytes, so its sha256 is known
          # right away (a new package can take minutes before the registry serves it)
          (cd dist/npm && npm pack --pack-destination ..)
          # "./": without it npm reads dist/… as a GitHub repo (user/repo)
          npm publish "./dist/korn-sync-$VERSION.tgz" --access public --provenance

      - name: Homebrew formula
        run: |
          SHA=$(shasum -a 256 "dist/korn-sync-$VERSION.tgz" | cut -d' ' -f1)
          node packaging/homebrew/render-formula.mjs "$VERSION" "$SHA" > dist/korn.rb
          ruby -c dist/korn.rb

      - name: Commit Formula/korn.rb to main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p Formula
          cp dist/korn.rb Formula/korn.rb
          git add Formula/korn.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "korn $VERSION: Homebrew formula"
          if ! git push origin main; then
            echo "::error::couldn't push to main (branch protection?). Allow GitHub Actions to push, or commit dist/korn.rb as Formula/korn.rb by hand"
            exit 1
          fi
