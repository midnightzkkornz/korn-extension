# Publishes korn (the background sync CLI) to Homebrew when a tag like korn-v0.1.0 is pushed:
# test → build the tarball → GitHub Release → update Formula/korn.rb in midnightzkkornz/homebrew-tap.
#
# One-time setup (see docs/daemon.md "Releasing"):
# - a public repo midnightzkkornz/homebrew-tap
# - secret HOMEBREW_TAP_TOKEN: a fine-grained token with Contents: read and write on homebrew-tap
#
# Release: bump daemon/version.ts, commit, then `make korn-tag` prints the tag commands.
name: korn release

on:
  push:
    tags: ['korn-v*']

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: macos-latest # the tests use macOS tools (osacompile); the tarball is plain JavaScript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches daemon/version.ts
        run: |
          VERSION=$(node -p "require('fs').readFileSync('daemon/version.ts','utf8').match(/'(.+)'/)[1]")
          if [ "korn-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match daemon/version.ts ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Test
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          npm test

      - name: Build the tarball and formula
        run: make daemon-release

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/korn-$VERSION.tar.gz" \
            --title "korn $VERSION" \
            --notes "Background sync for Korn Markdown Sync. Install: \`brew install midnightzkkornz/tap/korn\` then \`korn setup\`."

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::secret HOMEBREW_TAP_TOKEN is not set (see docs/daemon.md, Releasing)"
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/midnightzkkornz/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/korn.rb tap/Formula/korn.rb
          cd tap
          git add Formula/korn.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "korn $VERSION"
          git push
